<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusClaw · Open Source OpenClaw &amp; Hermes AI Agent Task Manager</title>
    <meta name="description" content="Local-first task manager for OpenClaw and Hermes agents with project context, due dates, comments, and an Agent Automation API." />
    <link rel="icon" type="image/png" href="/fc-logo-app.png" />
    <link rel="preload" as="image" href="/fc-logo-app.png" />
    <link rel="preload" as="image" href="/grok-hermes-app.png" />
    <script>
      (() => {
        const key = 'focusclaw.theme.preference'
        const familyKey = 'focusclaw.theme.family'
        let preference = 'dark'
        let family = 'openclaw'
        try {
          const stored = window.localStorage.getItem(key)
          if (stored === 'system' || stored === 'dark' || stored === 'light') preference = stored
          const storedFamily = window.localStorage.getItem(familyKey)
          if (storedFamily === 'openclaw' || storedFamily === 'hermes') family = storedFamily
          if (storedFamily === 'classic') family = 'openclaw'
        } catch {}
        const systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.themePreference = preference
        document.documentElement.dataset.theme = preference === 'system' ? systemTheme : preference
        document.documentElement.dataset.themeFamily = family
        const logo = family === 'hermes' ? '/grok-hermes-app.png' : '/fc-logo-app.png'
        const favicon = document.querySelector('link[rel="icon"]')
        if (favicon) favicon.href = logo
      })()
    </script>
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      html, body, #root {
        background: var(--bg-primary);
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
